services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: flashpay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flashpay
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      APPLICATION_SECURITY_JWT-SECRET: ${JWT_SECRET}
      APPLICATION_SECURITY_JWT-EXPIRATION: 86400000
    depends_on:
      - postgres